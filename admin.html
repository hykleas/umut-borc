<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim — Borç Takip</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f1117; color: #eef0f6;
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px;
  }
  .panel {
    background: #1a1d27; border: 1px solid #2e3347; border-radius: 14px;
    padding: 28px; width: 100%; max-width: 560px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #8a90a5; font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; color: #8a90a5; margin: 16px 0 6px; letter-spacing: 1px; text-transform: uppercase; }
  input, textarea {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3a4056;
    background: #232736; color: #eef0f6; font-size: 15px; font-family: inherit;
  }
  textarea { min-height: 120px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid #6c5ce7; border-color: transparent; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  button {
    width: 100%; margin-top: 24px; padding: 14px; border: none; border-radius: 10px;
    background: #6c5ce7; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  .msg { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
  .msg.ok { color: #2ed573; }
  .msg.err { color: #ff4757; }
  .preview {
    width: 120px; height: 120px; border-radius: 10px; object-fit: cover;
    border: 2px dashed #3a4056; margin-top: 10px; display: block;
  }
  .hint { font-size: 12px; color: #8a90a5; margin-top: 6px; }
  #editor { display: none; }
</style>
</head>
<body>
  <div class="panel">
    <h1>🔐 Borç Yönetim Paneli</h1>
    <div class="sub">Sadece alacaklı girebilir. Umut, sen girme.</div>

    <div id="login">
      <label>Şifre</label>
      <input type="password" id="password" placeholder="••••••" autofocus>
      <button id="loginBtn">Giriş Yap</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div id="editor">
      <label>Borçlunun Adı</label>
      <input id="f_name">

      <div class="row">
        <div>
          <label>Borç (TL)</label>
          <input id="f_amount" type="number" step="0.01" min="0">
        </div>
        <div>
          <label>Ödenen (TL)</label>
          <input id="f_paid" type="number" step="0.01" min="0">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Borç Tarihi</label>
          <input id="f_debtDate" type="date">
        </div>
        <div>
          <label>Manevi Faiz (TL/gün)</label>
          <input id="f_faiz" type="number" step="0.01" min="0">
        </div>
      </div>

      <label>Fotoğraf</label>
      <input id="f_photo" type="file" accept="image/*">
      <img id="photoPreview" class="preview" alt="" style="display:none">
      <div class="hint">Seçtiğin fotoğraf otomatik küçültülür. Ne kadar komik kare, o kadar iyi.</div>

      <label>Alacaklının Notu</label>
      <input id="f_note">

      <label>Dönen Mesajlar (her satır bir mesaj)</label>
      <textarea id="f_messages"></textarea>

      <button id="saveBtn">💾 Kaydet ve Yayınla</button>
      <div class="msg" id="saveMsg"></div>
    </div>
  </div>

<script>
let PW = '';
let currentPhoto = '';

async function api(body) {
  const r = await fetch('/api/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Sunucu hatası');
  return j;
}

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const msg = document.getElementById('loginMsg');
  msg.className = 'msg'; msg.textContent = 'Kontrol ediliyor…';
  PW = document.getElementById('password').value;
  try {
    await api({ password: PW, verifyOnly: true });
    const d = await fetch('/api/data').then(r => r.json());
    fill(d);
    document.getElementById('login').style.display = 'none';
    document.getElementById('editor').style.display = 'block';
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = e.message === 'unauthorized' ? 'Şifre yanlış. Umut sen misin?' : e.message;
  }
}

function fill(d) {
  document.getElementById('f_name').value = d.name || '';
  document.getElementById('f_amount').value = d.amount ?? 0;
  document.getElementById('f_paid').value = d.paid ?? 0;
  document.getElementById('f_debtDate').value = (d.debtDate || '').slice(0, 10);
  document.getElementById('f_faiz').value = d.faizPerDay ?? 0;
  document.getElementById('f_note').value = d.note || '';
  document.getElementById('f_messages').value = (d.messages || []).join('\n');
  currentPhoto = d.photo || '';
  if (currentPhoto) {
    const p = document.getElementById('photoPreview');
    p.src = currentPhoto; p.style.display = 'block';
  }
}

document.getElementById('f_photo').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const MAX = 700;
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    currentPhoto = c.toDataURL('image/jpeg', 0.82);
    const p = document.getElementById('photoPreview');
    p.src = currentPhoto; p.style.display = 'block';
  };
  img.src = URL.createObjectURL(file);
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('saveMsg');
  btn.disabled = true;
  msg.className = 'msg'; msg.textContent = 'Kaydediliyor…';
  const data = {
    name: document.getElementById('f_name').value.trim() || 'Umut Ardan',
    amount: parseFloat(document.getElementById('f_amount').value) || 0,
    paid: parseFloat(document.getElementById('f_paid').value) || 0,
    debtDate: document.getElementById('f_debtDate').value || '2026-06-01',
    faizPerDay: parseFloat(document.getElementById('f_faiz').value) || 0,
    photo: currentPhoto,
    note: document.getElementById('f_note').value,
    messages: document.getElementById('f_messages').value.split('\n').map(s => s.trim()).filter(Boolean)
  };
  try {
    await api({ password: PW, data });
    msg.className = 'msg ok';
    msg.textContent = '✅ Kaydedildi! Site birkaç saniye içinde güncellenir.';
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = '❌ ' + e.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
